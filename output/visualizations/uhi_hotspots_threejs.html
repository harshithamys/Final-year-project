<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UHI Hotspot Visualization - Three.js</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; font-family: Arial, sans-serif; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px;
            border-radius: 8px;
            z-index: 100;
            max-width: 300px;
        }
        #info h2 { margin-bottom: 10px; color: #ff6b6b; }
        #info p { margin: 5px 0; font-size: 14px; }
        #legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px;
            border-radius: 8px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
        }
        .legend-color {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            border-radius: 3px;
        }
        #tooltip {
            position: absolute;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            display: none;
            pointer-events: none;
            z-index: 200;
        }
    </style>
</head>
<body>

        <p><strong>Controls:</strong></p>

        <p>• Scroll: Zoom</p>

00000000000142, "z": 20.95398343834955}, "uhi_value": -0.011667837819558088, "intensity": 0.419079668766991, "color": {"r": 0, "g": 1, "b": 0.32368132493203605}}, {"position": {"x": 4.444444444445139, "y": 0.0, "z": 0.0}, "uhi_value": -0.10546902658715096, "intensity": 0.0, "color": {"r": 0, "g": 0, "b": 1}}, {"position": {"x": 4.444444444445139, "y": 1.1111111111112848, "z": 31.665625789167333}, "uhi_value": 0.036283177753027585, "intensity": 0.6333125157833467, "color": {"r": 0.5332500631333867, "g": 1, "b": 0}}, {"position": {"x": 4.444444444445139, "y": 2.2222222222225696, "z": 14.07666665707418}, "uhi_value": -0.042454370199568256, "intensity": 0.2815333331414836, "color": {"r": 0, "g": 1, "b": 0.8738666674340656}}, {"position": {"x": 4.444444444445139, "y": 3.333333333333144, "z": 34.78596157837118}, "uhi_value": 0.050251462458536525, "intensity": 0.6957192315674235, "color": {"r": 0.7828769262696942, "g": 1, "b": 0}}, {"position": {"x": 4.444444444445139, "y": 4.444444444444429, "z": 25.627289165838334}, "uhi_value": 0.00925236735300915, "intensity": 0.5125457833167667, "color": {"r": 0.050183133267066804, "g": 1, "b": 0}}, {"position": {"x": 4.444444444445139, "y": 5.5555555555557135, "z": 30.063156348496562}, "uhi_value": 0.02910967115267602, "intensity": 0.6012631269699312, "color": {"r": 0.4050525078797249, "g": 1, "b": 0}}, {"position": {"x": 4.444444444445139, "y": 6.666666666666998, "z": 22.191398008206832}, "uhi_value": -0.006128511228389643, "intensity": 0.44382796016413667, "color": {"r": 0, "g": 1, "b": 0.22468815934345332}}, {"position": {"x": 4.444444444445139, "y": 7.7777777777775725, "z": 21.875155445538855}, "uhi_value": -0.007544181351659676, "intensity": 0.4375031089107771, "color": {"r": 0, "g": 1, "b": 0.24998756435689162}}, {"position": {"x": 4.444444444445139, "y": 8.888888888888857, "z": 39.794327838706856}, "uhi_value": 0.07267157701027319, "intensity": 0.7958865567741371, "color": {"r": 1, "g": 0.8164537729034516, "b": 0}}, {"position": {"x": 4.444444444445139, "y": 10.000000000000142, "z": 23.76919253223058}, "uhi_value": 0.0009345373045953126, "intensity": 0.4753838506446116, "color": {"r": 0, "g": 1, "b": 0.09846459742155367}}];
        
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        
        // Camera
        const camera = new THREE.PerspectiveCamera(
            60, window.innerWidth / window.innerHeight, 0.1, 2000
        );
        camera.position.set(150, 150, 150);
        
        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);
        
        // Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(100, 200, 100);
        directionalLight.castShadow = true;
        scene.add(directionalLight);
        
        // Ground plane (terrain)
        const groundGeometry = new THREE.PlaneGeometry(200, 200, 50, 50);
        const groundMaterial = new THREE.MeshStandardMaterial({
            color: 0x2d3436,
            roughness: 0.8,
            metalness: 0.2,
            wireframe: false
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.set(50, 0, 50);
        ground.receiveShadow = true;
        scene.add(ground);
        
        // Grid helper
        const gridHelper = new THREE.GridHelper(200, 20, 0x444444, 0x333333);
        gridHelper.position.set(50, 0.1, 50);
        scene.add(gridHelper);
        
        // Create hotspot pillars
        const pillars = [];
        hotspotData.forEach((point, index) => {
            // Pillar geometry
            const height = Math.max(point.position.z, 2);
            const geometry = new THREE.CylinderGeometry(1.5, 2, height, 16);
            
            // Color based on intensity
            const color = new THREE.Color(
                point.color.r,
                point.color.g,
                point.color.b
            );
            
            const material = new THREE.MeshStandardMaterial({
                color: color,
                emissive: color,
                emissiveIntensity: 0.3,
                roughness: 0.4,
                metalness: 0.6
            });
            
            const pillar = new THREE.Mesh(geometry, material);
            pillar.position.set(
                point.position.x,
                height / 2,
                point.position.y
            );
            pillar.castShadow = true;
            pillar.userData = {
                uhi: point.uhi_value,
                intensity: point.intensity,
                index: index
            };
            
            scene.add(pillar);
            pillars.push(pillar);
            
            // Add glow effect for high intensity
            if (point.intensity > 0.7) {
                const glowGeometry = new THREE.CylinderGeometry(2.5, 3, height * 0.8, 16);
                const glowMaterial = new THREE.MeshBasicMaterial({
                    color: color,
                    transparent: true,
                    opacity: 0.2
                });
                const glow = new THREE.Mesh(glowGeometry, glowMaterial);
                glow.position.copy(pillar.position);
                scene.add(glow);
            }
        });
        
        // Raycaster for interaction
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const tooltip = document.getElementById('tooltip');
        
        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(pillars);
            
            if (intersects.length > 0) {
                const obj = intersects[0].object;
                tooltip.style.display = 'block';
                tooltip.style.left = event.clientX + 15 + 'px';
                tooltip.style.top = event.clientY + 15 + 'px';
                tooltip.innerHTML = `
                    <strong>Hotspot #${obj.userData.index + 1}</strong><br>
                    UHI Value: ${obj.userData.uhi.toFixed(4)}°C<br>
                    Intensity: ${(obj.userData.intensity * 100).toFixed(1)}%
                `;
            } else {
                tooltip.style.display = 'none';
            }
        }
        
        window.addEventListener('mousemove', onMouseMove);
        
        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            
            // Subtle animation for pillars
            const time = Date.now() * 0.001;
            pillars.forEach((pillar, i) => {
                if (pillar.userData.intensity > 0.6) {
                    pillar.material.emissiveIntensity = 0.3 + Math.sin(time * 2 + i) * 0.1;
                }
            });
            
            renderer.render(scene, camera);
        }
        
        animate();
    </script>
</body>
</html>
